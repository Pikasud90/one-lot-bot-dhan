# ─────────────────────────────────────────────────────────────────────────────
#  Instrument universe for the Backtest Lab and the data corpus.
#
#  Every entry is a PRICE SERIES (what the strategy reads) plus the tradeable
#  instruments derived from it. The one-lot rule is applied per category:
#     STOCK     -> 1 share
#     FUTURES   -> 1 lot of the near-month future
#     OPTIONS   -> 1 lot of a delta-selected CE (long signal) / PE (short signal)
#     CURRENCY  -> 1 lot of the near-month currency future
#  Lot sizes below are FALLBACKS; the Dhan scrip master overrides them whenever
#  it is reachable (SEBI revises index lot sizes; never trust a constant).
#  Dhan security IDs for indices are likewise resolved from the scrip master.
#  Yahoo symbols are for the keyless corpus; Dhan takes over once the Data API
#  subscription is active.
# ─────────────────────────────────────────────────────────────────────────────

indices:
  - {key: BANKNIFTY,  label: "NIFTY BANK",          yahoo: "^NSEBANK",  dhan_security_id: "25",  exchange: NSE, fno: true,  lot_size: 35,  strike_step: 100}
  - {key: NIFTY,      label: "NIFTY 50",            yahoo: "^NSEI",     dhan_security_id: "13",  exchange: NSE, fno: true,  lot_size: 75,  strike_step: 50}
  - {key: FINNIFTY,   label: "NIFTY FIN SERVICE",   yahoo: "NIFTY_FIN_SERVICE.NS", dhan_security_id: "27", exchange: NSE, fno: true, lot_size: 65, strike_step: 50}
  - {key: MIDCPNIFTY, label: "NIFTY MIDCAP SELECT", yahoo: "^NSEMDCP50", dhan_security_id: "442", exchange: NSE, fno: true, lot_size: 140, strike_step: 25}
