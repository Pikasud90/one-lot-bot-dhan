currency:
  # NSE currency derivatives, session 09:00-17:00 IST. Spot FX from Yahoo drives
  # the signals; one lot of the near-month future is the trade.
  - {key: USDINR, label: "USD/INR", yahoo: "USDINR=X", lot_size: 1000,   tick_size: 0.0025}
  - {key: EURINR, label: "EUR/INR", yahoo: "EURINR=X", lot_size: 1000,   tick_size: 0.0025}
  - {key: GBPINR, label: "GBP/INR", yahoo: "GBPINR=X", lot_size: 1000,   tick_size: 0.0025}
  - {key: JPYINR, label: "JPY/INR", yahoo: "JPYINR=X", lot_size: 100000, tick_size: 0.0025, price_per: 100}
  - {key: EURUSD, label: "EUR/USD", yahoo: "EURUSD=X", lot_size: 1000,   tick_size: 0.0001, quote_ccy: USD}

sessions:
  equity:   {open: "09:15", close: "15:30", square_off: "15:15", first_entry: "09:30", last_entry: "14:45"}
  currency: {open: "09:00", close: "17:00", square_off: "16:45", first_entry: "09:15", last_entry: "16:00"}

# Market index used for relative filters (gap fade, market bias) on stocks.
market_index: NIFTY
