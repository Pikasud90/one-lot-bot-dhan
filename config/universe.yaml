  - {key: ICICIBANK,  label: "ICICI Bank",          yahoo: "ICICIBANK.NS",  dhan_security_id: "4963",  fno: true,  lot_size: 700,  strike_step: 10,  sector: Banks}
  - {key: SBIN,       label: "State Bank of India", yahoo: "SBIN.NS",       dhan_security_id: "3045",  fno: true,  lot_size: 750,  strike_step: 5,   sector: Banks}
  - {key: INFY,       label: "Infosys",             yahoo: "INFY.NS",       dhan_security_id: "1594",  fno: true,  lot_size: 400,  strike_step: 20,  sector: IT}
  - {key: TCS,        label: "Tata Consultancy",    yahoo: "TCS.NS",        dhan_security_id: "11536", fno: true,  lot_size: 175,  strike_step: 50,  sector: IT}
  - {key: AXISBANK,   label: "Axis Bank",           yahoo: "AXISBANK.NS",   dhan_security_id: "5900",  fno: true,  lot_size: 625,  strike_step: 10,  sector: Banks}
  - {key: KOTAKBANK,  label: "Kotak Mahindra Bank", yahoo: "KOTAKBANK.NS",  dhan_security_id: "1922",  fno: true,  lot_size: 400,  strike_step: 20,  sector: Banks}
