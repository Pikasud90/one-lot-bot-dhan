  stt_sell_pct: 0.0010
  stt_exercise_pct: 0.00125
  exchange_txn_pct: 0.0003503
  sebi_turnover_pct: 0.0000010
  ipft_pct: 0.0000050
  stamp_duty_pct: 0.00003
  gst_pct: 0.18

