# ─────────────────────────────────────────────────────────────────────────────
#  NSE trading holidays (equity / F&O segment).
#
#  !! `verified: false` means the engine will WARN on every startup. !!
#
#  Only fixed-date national holidays are pre-filled below, because those are
#  the only ones that can be stated without consulting a circular. Every
#  lunar-calendar holiday (Holi, Ram Navami, Mahavir Jayanti, Id, Muharram,
#  Ganesh Chaturthi, Dussehra, Diwali/Laxmi Pujan, Guru Nanak Jayanti, ...)
#  MOVES EVERY YEAR and is deliberately NOT guessed here.
#
#  TO COMPLETE THIS FILE:
#    1. Open the NSE holiday circular for the year:
#       https://www.nseindia.com/resources/exchange-communication-holidays
#    2. Add every date as `- {date: "YYYY-MM-DD", name: "..."}`
#    3. Add any muhurat / special sessions under `special_sessions`
#    4. Set `verified: true`
#
#  FAILURE MODE IF YOU DON'T: the engine treats an unlisted holiday as a
#  trading day, finds no market data, drops to health=DEAD, and emits no
#  signals. Annoying, never dangerous — it cannot trade on a closed exchange.
# ─────────────────────────────────────────────────────────────────────────────
verified: false

holidays:
  2026:
    - {date: "2026-01-26", name: "Republic Day"}
    - {date: "2026-05-01", name: "Maharashtra Day"}
    - {date: "2026-08-15", name: "Independence Day"}
    - {date: "2026-10-02", name: "Mahatma Gandhi Jayanti"}
    - {date: "2026-12-25", name: "Christmas"}
  2027:
    - {date: "2027-01-26", name: "Republic Day"}
    - {date: "2027-08-15", name: "Independence Day"}
    - {date: "2027-10-02", name: "Mahatma Gandhi Jayanti"}
    - {date: "2027-12-25", name: "Christmas"}

# Sessions that run at non-standard hours (e.g. Diwali Muhurat trading).
# The engine will NOT trade these unless explicitly enabled.
special_sessions: []
