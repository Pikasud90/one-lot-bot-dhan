# Live Desk watchlist.
#
# Indices are tracked through their OPTIONS: a bullish signal means BUY a CE, a bearish
# signal means BUY a PE; the only exit is selling that option back. Stocks are traded as
# ONE share, long or short, intraday. Every instrument runs several strategies at once;
# each strategy decides on its own closed bars of its own timeframe.
#
# Edit, then press "Reload desk config" in Settings (or restart). Strategy names are the
# Backtest Lab names; `params` overrides the strategy defaults (the Lab's "Apply best
# params" writes the same keys).

poll_seconds: 60          # how often fresh bars are pulled during the session
history_days: 25          # fine bars kept in memory per instrument: ~17 sessions, so the daily ATR(14), NR7 and CPR warm up
source: auto              # auto = Dhan 1-minute bars when the Data API is active, else Yahoo 2-minute (delayed ~15 min)
signal_valid_minutes: 10  # a BUY/SELL alert expires if not acknowledged within this window
# intraday until the paper book can carry a stock overnight (US-027): every alert's one exit
# is its paper trade's close, which is the session end at the latest, so a "swing" alert would
# promise a hold its own exit alert never gives (QA cycle 1, 2026-11-07). Set swing again
# once US-027 lands.
stock_horizon: intraday

context:                  # the strip above the two panels
  - {key: INDIAVIX, label: "India VIX"}
  - {key: NIFTY,     label: "NIFTY 50"}
  - {key: BANKNIFTY, label: "NIFTY BANK"}
  - {key: SENSEX,    label: "SENSEX"}
  - {key: USDINR,    label: "USD/INR"}
  - {key: GIFTNIFTY, label: "GIFT NIFTY", manual: true,
     note: "No free feed exists (NSE IX). Feed it from your own source: POST /api/desk/context {\"key\":\"GIFTNIFTY\",\"last\":25410,\"change_pct\":0.3}"}

# PAPER TEST (owner's go-ahead, 2026-11-07): the desk runs ONLY the closest candidates of the
# cross-instrument retune (docs/research/CROSS_RETUNE_2026-11-07.md), with the retune's exact
# settings, so every alert and its paper trade is forward evidence for one setting tested
# across the whole basket. None of them passed all three backtest years: this is a test, not
# a recommendation. Before the test the desk ran the owner's seven on 15-minute bars:
#   primary_strategies: [ema_cross, supertrend_vol, gap_fade, nr7_breakout, turtle_soup,
#                        ema_pullback, cpr_breakout]  (every slot `timeframe: 15m`, defaults)
# `allow_long` / `allow_short` are the Lab's `direction`. Index alerts name the MONTHLY
# contract at delta ~0.65, rolled to the next month inside its last 3 days, like the Lab.
# 2026-11-11: `supertrend_mtf` (the owner's multi-timeframe rule) joined the index list as a
# second paper slot; the three slots above it are unchanged.
primary_strategies: [supertrend_vol, supertrend_adx, supertrend_mtf]

option_expiry: monthly    # monthly (the Lab's contract) | nearest (the weekly where one exists)
option_roll_days: 3       # a monthly contract with fewer days left than this is skipped

defaults:
  index_strategies:       # 5 index options, long only (BUY CE): passed tuning + choosing, lost the test year
    - name: supertrend_vol
      timeframe: 30m
      params: {allow_long: true, allow_short: false, adx_min: 12, entry_end: "13:00",
               flip_window: 2, max_bars: 12, max_trades_per_day: 1, min_strength: 40,
               partial_r: 0.0, regime_filter: false, rsi_long_min: 55, st_mult: 2.0,
               st_period: 14, target_r: 2.5, trail_atr_mult: 1.5}
    # MULTI-TIMEFRAME SUPERTREND (owner's rule, 2026-11-11). Supertrend(14, 1.7) on 1m, 5m, 15m,
    # 30m, 60m and 1d must ALL point up. The entry is taken within 4 bars of a fresh 30m turn
    # with 30m ADX >= 25 and RSI >= 60, before 13:00, once a day. The 60m Supertrend line is the
    # stop and the trail: the trade ends when a 60m bar closes below the line; the stop itself
    # stands 2 ATR(60m) under the line as the backstop, moves at every 60m close and only up.
    # Evidence, not advice (docs/research/SUPERTREND_MTF_2026-11-11.md): the plain rule (all six
    # aligned, any time of day) LOST after costs over five years, so it is not alerted; every
    # card shows the six trends instead. This filtered form made +2.6% of premium a trade on
    # modelled premiums (202 trades, t 1.8) but about +0.7% (t 0.3) on the real premiums that
    # could be checked: unproven. 95% of its trades end at the session close, so the trail
    # rarely acts until an index-option trade can be carried overnight (story US-041 in
    # REVIEW.md; US-027 covers stocks only). While its paper trade is open the slot above is
    # silent on that index (one live idea per instrument), and the other way round. To drop
    # it: delete this entry and its name from primary_strategies.
    - name: supertrend_mtf
      timeframe: 5m
      params: {allow_long: true, allow_short: false, st_period: 14, st_mult: 1.7, gate: all,
               trend_tf: 30m, flip_window: 4, trend_adx_min: 25, trend_rsi_min: 60,
               entry_end: "13:00", trail_tf: 60m, stop_buffer_atr: 2.0, max_trades_per_day: 1}
  stock_strategies:       # 18 stocks, one share, short only: lost the choosing year
    - name: supertrend_vol
      timeframe: 60m
      params: {allow_long: false, allow_short: true, adx_min: 12, entry_end: "11:30",
               flip_window: 4, max_bars: 12, max_trades_per_day: 2, min_strength: 55,
               partial_r: 0.0, regime_filter: true, rsi_long_min: 50, st_mult: 2.0,
               st_period: 7, target_r: 1.5, trail_atr_mult: 2.5}
    - name: supertrend_adx
      timeframe: 30m
      params: {allow_long: false, allow_short: true, adx_min: 25, entry_end: "11:30",
               flip_window: 4, max_bars: 24, max_trades_per_day: 1, max_vwap_dist_atr: 3.0,
               min_strength: 0, partial_r: 0.0, regime_filter: true, st_mult: 2.5,
               st_period: 14, target_r: 1.5, trail_atr_mult: 1.5}

indices:
  - {key: BANKNIFTY,  tracked: BANKNIFTY_OPT}
  - {key: NIFTY,      tracked: NIFTY_OPT}
  - {key: FINNIFTY,   tracked: FINNIFTY_OPT}
  - {key: MIDCPNIFTY, tracked: MIDCPNIFTY_OPT}
  - {key: SENSEX,     tracked: SENSEX_OPT}

stocks:                     # the retune's 18-stock basket (Adani Green excluded at the owner's request)
  - {key: RELIANCE}
  - {key: MM}                   # Mahindra & Mahindra (NSE symbol M&M)
  - {key: SBIN}
  - {key: HDFCBANK}
  - {key: ITC}
  - {key: TMPV, note: "Tata Motors Passenger Vehicles (post-demerger); TMCV is the commercial-vehicle entity"}
  - {key: MARUTI}
  - {key: ICICIBANK}
  - {key: HEROMOTOCO}
  - {key: INFY}
  - {key: TCS}
  - {key: AXISBANK}
  - {key: KOTAKBANK}
  - {key: LT}
  - {key: BAJFINANCE}
  - {key: BHARTIARTL}
  - {key: TATASTEEL}
  - {key: SUNPHARMA}
