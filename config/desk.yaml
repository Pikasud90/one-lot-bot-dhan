# Live Desk watchlist (owner, 2026-11-13, US-068): two rules, nothing else.
#
# Indices: the micro-trend rule on options (BUY a call or a put, one lot, intraday). Stocks:
# the pullback rule as delivery trades of about Rs 10,000 (US-067). Alerts and paper trades
# only: the system never places an order. Edit, then press "Reload desk config" in Settings
# (or restart). The slots removed on 2026-11-13 are in git history.

poll_seconds: 60          # how often fresh bars are pulled during the session
history_days: 25          # fine bars kept in memory per instrument: ~17 sessions, so the daily ATR(14), NR7 and CPR warm up
source: auto              # auto = Dhan 1-minute bars when the Data API is active, else Yahoo 2-minute (delayed ~15 min)
signal_valid_minutes: 10  # a BUY/SELL alert expires if not acknowledged within this window
stock_horizon: intraday   # intraday stock alerts (none run now: stocks are delivery trades)

context:                  # the strip above the two panels
  - {key: INDIAVIX, label: "India VIX"}
  - {key: NIFTY,     label: "NIFTY 50"}
  - {key: BANKNIFTY, label: "NIFTY BANK"}
  - {key: SENSEX,    label: "SENSEX"}
  - {key: USDINR,    label: "USD/INR"}
  - {key: GIFTNIFTY, label: "GIFT NIFTY", manual: true,
     note: "No free feed exists (NSE IX). Feed it from your own source: POST /api/desk/context {\"key\":\"GIFTNIFTY\",\"last\":25410,\"change_pct\":0.3}"}

primary_strategies: [pullback, microtrend]

option_expiry: monthly    # monthly (the Lab's contract) | nearest (the weekly where one exists)
option_roll_days: 3       # a monthly contract with fewer days left than this is skipped

delivery:                 # the delivery slots (US-067 pullback)
  top_up: true            # top the store's 1m bars up from Dhan (Data API on, outside 09:00 to 15:35)
  last_bar_at: "15:10"    # a session is complete once its last 1m bar is at or after this ...
  settle_minutes: 10      # ... and the clock is 10 minutes past the session's close
  min_bars: 201           # daily bars an entry reads at least (the rule's own minimum)
  gap_warn_pct: 20        # a first bar this far from the previous close: "possible corporate action"
  special_min_bars: 30    # a day off the calendar counts as a special session (Muhurat) from 30 1m bars

defaults:
  index_strategies:       # 5 index options
    # MICRO TREND (owner's rule, US-068). Supertrend(14, 1.7) on 3m, 5m, 10m, 15m, 30m, 60m and
    # 4h, from the one-minute bars. At a 3-minute close where all seven newly point up: BUY a
    # call; all down: BUY a put (monthly contract at delta ~0.65, one lot). Out at the first
    # 3-minute close where 3 of the 7 point against the trade, else at the session end. The
    # alert's stop is a backstop 3 ATR(60m) beyond the 60m line, not the rule's exit.
    - name: microtrend
      timeframe: 3m
      params: {st_period: 14, st_mult: 1.7, exit_count: 3, stop_buffer_atr: 3.0,
               evidence: "Backtest of this exact rule: 3,824 trades over five years on five indices, −0.2% of premium a trade on modelled premiums, 38% winners. Not an edge: this is the paper test."}
  stock_strategies:       # 18 stocks
    # PULLBACK, delivery (owner's decision 2026-11-12, US-067; docs/research/ALPHA_SEARCH_2026-11-12.md
    # 5.2 and 5.3). After the close: the close is above its SMA200, NIFTY is above its SMA200,
    # and the close is for the first day 8% or more below the highest close of 20 sessions.
    # Buy the number of shares nearest Rs 10,000 at the next open; sell at the open after the
    # first close above SMA20, after 30 sessions (the entry session counts as 1), or after a
    # close 15% below the entry fill. Delivery charges plus the depository charge.
    - name: pullback
      timeframe: 1d
      product: delivery
      params: {depth: 0.08, high_lookback: 20, trend_sma: 200, exit_sma: 20, max_sessions: 30,
               stop: 0.15, slippage: 0.0003, unit_inr: 10000,
               evidence: "Backtest: +1.2% to +1.4% a trade after charges, about 7 winners in 10, two samples. Not proven: this is the paper test."}

indices:
  - {key: BANKNIFTY,  tracked: BANKNIFTY_OPT}
  - {key: NIFTY,      tracked: NIFTY_OPT}
  - {key: FINNIFTY,   tracked: FINNIFTY_OPT}
  - {key: MIDCPNIFTY, tracked: MIDCPNIFTY_OPT}
  - {key: SENSEX,     tracked: SENSEX_OPT}

stocks:                     # the retune's 18-stock basket (Adani Green excluded at the owner's request)
  - {key: RELIANCE}
  - {key: MM}                   # Mahindra & Mahindra (NSE symbol M&M)
  - {key: SBIN}
  - {key: HDFCBANK}
  - {key: ITC}
  - {key: TMPV, note: "Tata Motors Passenger Vehicles (post-demerger); TMCV is the commercial-vehicle entity"}
  - {key: MARUTI}
  - {key: ICICIBANK}
  - {key: HEROMOTOCO}
  - {key: INFY}
  - {key: TCS}
  - {key: AXISBANK}
  - {key: KOTAKBANK}
  - {key: LT}
  - {key: BAJFINANCE}
  - {key: BHARTIARTL}
  - {key: TATASTEEL}
  - {key: SUNPHARMA}
