[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onelot-desk"
version = "3.0.0"
description = "One Lot Desk: signal-only Dhan trade desk — live Bank Nifty option signals, one-unit backtest lab across options/futures/stocks/currency, account ledger, news & sentiment. Human-in-the-loop. Places no orders."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sudhanshu Shekhar" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "live: requires real broker credentials; excluded from CI and default runs",
    "slow: long-running",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "E741"]  # E741: `l` is the bar LOW throughout the OHLC code
