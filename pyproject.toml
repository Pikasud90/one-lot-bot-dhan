[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onelot-desk"
version = "3.0.0"
description = "One Lot Desk: signal-only Dhan trade desk — live Bank Nifty option signals, one-unit backtest lab across options/futures/stocks/currency, account ledger, news & sentiment. Human-in-the-loop. Places no orders."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sudhanshu Shekhar" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "SQLAlchemy>=2.0,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "dhanhq>=2.0,<3",
    "yfinance>=0.2.40",
    "windows-toasts>=1.1.1 ; sys_platform == \"win32\"",
    "plyer>=2.1 ; sys_platform == \"win32\"",
]

[project.scripts]
onelot = "onelot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-q --strict-markers -m "not live"'
markers = [
    "live: requires real broker credentials; excluded from CI and default runs",
    "slow: long-running",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Markdown is prose: never let the formatter rewrite code fences in stories, ADRs or docs.
extend-exclude = [".agile", "docs", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "E741"]  # E741: `l` is the bar LOW throughout the OHLC code
